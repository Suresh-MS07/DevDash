<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DevDash Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">PERSONALIZE YOUR NEW TAB</p>
        <h1>DevDash Settings</h1>
        <p>Configure only the widgets you use. DevDash does not require a GitHub token.</p>
      </div>
      <a class="dashboard-link" href="dashboard.html">Open dashboard ↗</a>
    </header>

    <form id="settings-form">
      <section class="settings-card">
        <h2>Profiles and APIs</h2>
        <div class="form-grid">
          <label>
            <span>GitHub username</span>
            <input type="text" id="githubUsername" maxlength="39" autocomplete="off" placeholder="octocat">
            <small>Used only to load public activity.</small>
          </label>
          <label>
            <span>LeetCode username</span>
            <input type="text" id="leetcodeUsername" maxlength="50" autocomplete="off" placeholder="user123">
          </label>
          <label>
            <span>Weather city</span>
            <input type="text" id="weatherCity" maxlength="80" autocomplete="off" placeholder="Raipur">
          </label>
          <label>
            <span>OpenWeatherMap API key</span>
            <input type="password" id="weatherApiKey" autocomplete="off" placeholder="Stored only on this device">
            <small>This secret stays in local extension storage and is not synced.</small>
          </label>
          <label>
            <span>Stack Overflow user ID</span>
            <input type="text" id="stackoverflowId" inputmode="numeric" maxlength="20" autocomplete="off" placeholder="1234567">
          </label>
        </div>
      </section>

      <section class="settings-card">
        <h2>Visible widgets</h2>
        <p class="section-copy">Choose what appears on your dashboard.</p>
        <div id="widget-visibility-container" class="checkbox-grid"></div>
      </section>

      <section class="settings-card">
        <h2>Quick links</h2>
        <div id="links-container" class="saved-links"></div>
        <div class="add-link-form">
          <label>
            <span>Label</span>
            <input type="text" id="linkName" maxlength="40" placeholder="Portfolio">
          </label>
          <label>
            <span>URL</span>
            <input type="url" id="linkUrl" maxlength="500" placeholder="https://example.com">
          </label>
          <button id="addLinkBtn" class="button-secondary" type="button">Add link</button>
        </div>
        <p id="linkError" class="field-error" role="alert"></p>
      </section>

      <div class="form-actions">
        <button id="saveButton" type="submit">Save settings</button>
        <button id="clearCacheButton" class="button-secondary" type="button">Clear API cache</button>
      </div>
      <div id="statusMessage" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="options.js"></script>
</body>
</html>
