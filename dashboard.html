<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DevDash</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <a class="settings-link" href="options.html" target="_blank" rel="noopener" aria-label="Open DevDash settings">⚙</a>

  <main id="dashboard-container">
    <section id="greeting-widget" class="widget hero-widget" aria-live="polite">
      <div class="eyebrow">DEVELOPER COMMAND CENTER</div>
      <div class="time">--:--</div>
      <div class="greeting">Welcome to DevDash</div>
    </section>

    <section id="weather-widget" class="widget">
      <h2><span aria-hidden="true">🌤</span> Weather</h2>
      <div id="weather-content" class="widget-content" aria-live="polite"></div>
    </section>

    <section id="github-widget" class="widget">
      <h2><span aria-hidden="true">◉</span> GitHub Activity</h2>
      <div id="github-content" class="widget-content" aria-live="polite"></div>
    </section>

    <section id="leetcode-widget" class="widget">
      <h2><span aria-hidden="true">⌁</span> LeetCode Stats</h2>
      <div id="leetcode-content" class="widget-content" aria-live="polite"></div>
    </section>

    <section id="links-widget" class="widget">
      <h2><span aria-hidden="true">↗</span> Quick Links</h2>
      <div id="links-content" class="widget-content"></div>
    </section>

    <section id="devto-widget" class="widget">
      <h2><span aria-hidden="true">DEV</span> Dev.to Feed</h2>
      <div id="devto-content" class="widget-content" aria-live="polite"></div>
    </section>

    <section id="hackernews-widget" class="widget">
      <h2><span aria-hidden="true">Y</span> Hacker News</h2>
      <div id="hackernews-content" class="widget-content" aria-live="polite"></div>
    </section>

    <section id="todo-list-widget" class="widget">
      <h2><span aria-hidden="true">✓</span> To-Do List</h2>
      <div id="todo-content" class="widget-content">
        <label class="sr-only" for="todo-input">Add a task</label>
        <input id="todo-input" type="text" maxlength="120" autocomplete="off" placeholder="Add a task and press Enter">
        <ul id="todo-list" class="clean-list"></ul>
      </div>
    </section>

    <section id="quick-notes-widget" class="widget">
      <h2><span aria-hidden="true">✎</span> Quick Notes</h2>
      <label class="sr-only" for="quick-notes-content">Quick notes</label>
      <textarea id="quick-notes-content" maxlength="5000" placeholder="Capture an idea, command, or reminder..."></textarea>
    </section>

    <section id="pomodoro-timer-widget" class="widget pomodoro-widget">
      <h2><span aria-hidden="true">◷</span> Pomodoro</h2>
      <div id="pomodoro-content">
        <div id="pomodoro-timer" role="timer" aria-live="off">25:00</div>
        <div class="button-row">
          <button id="pomodoro-start" type="button">Start</button>
          <button id="pomodoro-reset" class="button-secondary" type="button">Reset</button>
        </div>
      </div>
    </section>

    <section id="stack-overflow-widget" class="widget">
      <h2><span aria-hidden="true">▤</span> Stack Overflow</h2>
      <div id="stackoverflow-content" class="widget-content" aria-live="polite"></div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
